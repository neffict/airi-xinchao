[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gwen-digestor"
version = "1.0.0"
description = "MCP server for conversation compression — reduces token consumption before context window entry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
]
